server {
    listen 80;
    server_name your_domain_or_IP;
    root /var/www/automation/dashboard/public;

    index index.php index.html;

    # Protect sensitive files and directories
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ^~ /storage/ {
        deny all;
    }
    location ^~ /deployment/ {
        deny all;
    }
    location ^~ /tests/ {
        deny all;
    }

    # Route everything to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Execute PHP but explicitly deny execution for anything except index.php
    location ~ \.php$ {
        # Only allow index.php to be directly executed
        if ($fastcgi_script_name != /index.php) {
            return 404;
        }
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    error_log  /var/log/nginx/automation_error.log;
    access_log /var/log/nginx/automation_access.log;
}
